<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ox-chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='13' font-size='13'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">

    <header class="hero" id="hero">
      <div class="logo" aria-hidden="true">&#9670;</div>
      <h1>Hello, welcome &#128075;</h1>
      <p class="sub">
        This is a tiny local wrapper &mdash; your prompts go to the model behind
        your terminal, straight from the browser.
      </p>
    </header>

    <main class="chat" id="chat" aria-live="polite"></main>

    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Message ox-alpha&hellip;" autofocus></textarea>
      <button id="send" type="submit" title="Send (Enter)" aria-label="Send">&#8593;</button>
    </form>

    <p class="hint">Enter to send &middot; Shift+Enter for a newline &middot; a reply can take up to a minute</p>

  </div>
  <script src="/app.js"></script>
</body>
</html>
